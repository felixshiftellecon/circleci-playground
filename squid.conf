http_port 3128
http_port 3129 transparent

# Transparent proxy settings
httpd_suppress_version_string on
via off
forwarded_for off

# Additional settings for transparent proxy
always_direct allow all

acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain .circleci.com .github.com .githubusercontent.com .githubassets.com
acl localhost src 127.0.0.1/32

# Allow CONNECT for SSL ports (needed for HTTPS)
http_access allow CONNECT SSL_ports

# Allow localhost connections
http_access allow localhost

# Allow allowed domains
http_access allow allowed_domains

# For debugging: temporarily allow all traffic to see what's happening
http_access allow all

httpd_suppress_version_string on
via off
forwarded_for off

access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

debug_options ALL,1

cache_mem 0

logformat combined %>a %ui %un [%tl] "%rm %ru HTTP/%rv" %Hs %<st "%{Referer}>h" "%{User-Agent}>h" %Ss:%Sh

visible_hostname squid-proxy

httpd_suppress_version_string on
via off
forwarded_for off 