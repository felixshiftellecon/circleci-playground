# Squid proxy configuration for CircleCI access control
http_port 3128

# Define allowed domains (CircleCI and GitHub)
acl allowed_domains dstdomain .circleci.com .github.com .githubusercontent.com .githubassets.com

# Define blocked domains (explicitly block Google)
acl blocked_domains dstdomain .google.com .gmail.com .youtube.com

# Define localhost access
acl localhost src 127.0.0.1/32

# Define HTTPS CONNECT method
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow localhost to access the proxy
http_access allow localhost

# Block CONNECT requests to blocked domains
http_access deny CONNECT blocked_domains

# Allow CONNECT requests to allowed domains
http_access allow CONNECT allowed_domains

# Block regular requests to blocked domains
http_access deny blocked_domains

# Allow regular requests to allowed domains
http_access allow allowed_domains

# Deny all other requests
http_access deny all

# Basic logging
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Enable debug logging for ACL matching
debug_options ALL,1

# Disable caching for testing
cache_mem 0
# Don't use cache_dir null as it's not supported in all versions 