# Squid proxy configuration for CircleCI with domain safelist
http_port 3128
http_port 3129 transparent

# Basic settings
httpd_suppress_version_string on
via off
forwarded_for off
visible_hostname squid-proxy

# Define ACLs for access control
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain .circleci.com .github.com .githubusercontent.com .githubassets.com

# Allow SSL CONNECT only to safelisted domains
http_access allow CONNECT allowed_domains

# Allow access to safelisted domains
http_access allow allowed_domains

# Deny everything else
http_access deny all

# Logging
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Disable caching to avoid issues
cache_mem 0

# Debug options (remove in production)
debug_options ALL,1 