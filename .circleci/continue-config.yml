version: 2.1

# Parameter test - CONTINUED pipeline.
# Consumes parameters forwarded through the continue API by
# continuation/continue in the setup pipeline (Path 2).

parameters:
  forwarded-value:
    type: string
    default: nothing-forwarded
  forwarded-number:
    type: integer
    default: -1
  # Explicitly-set SETUP pipeline params propagate into the continued pipeline,
  # so the continued config must also declare them or compilation errors with
  # "Unexpected argument(s): test-value".
  test-value:
    type: string
    default: default-from-config
  test-number:
    type: integer
    default: 0

jobs:
  show-continued-params:
    docker:
      - image: cimg/base:stable
    environment:
      FWD_VALUE: << pipeline.parameters.forwarded-value >>
    steps:
      - run:
          name: "Path 2 - params received via the CONTINUE path"
          command: |
            echo "forwarded-value  = ${FWD_VALUE}"
            echo "value length     = ${#FWD_VALUE}"
            echo "forwarded-number = << pipeline.parameters.forwarded-number >>"

workflows:
  continued:
    jobs:
      - show-continued-params
