version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1

jobs:
  test:
    docker:
      - image: cimg/base:2023.04
    shell: /bin/bash --login -eo pipefail
    steps:
      - run: echo $SHELL
      - run: |
          echo 'export CODEPUSH_DEPLOYMENT_NAME=pr${CIRCLE_PULL_REQUEST##*/}' >> "$BASH_ENV"
          echo "$CODEPUSH_DEPLOYMENT_NAME"
      - run: |
          echo "$CODEPUSH_DEPLOYMENT_NAME"

workflows:
  setup-workflow:
    jobs:
      - test
