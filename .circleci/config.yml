version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: "16.0.0"
    resource_class: m4pro.medium
  docker:
    docker:
      - image: cimg/base:2025.07

commands:
  setup-squid:
    description: "Install and start Squid proxy"
    steps:
      - run:
          name: "Install Squid and start proxy"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              brew install squid curl
            else
              sudo apt-get update
              sudo apt-get install -y squid curl
            fi
            
            squid -f squid.conf -N -p -d 1 &
            echo "Squid started (no cache mode, no PID file)"
            
            sleep 2
            
            if pgrep squid > /dev/null; then
              echo "✅ Squid is running"
            else
              echo "❌ Squid failed to start"
              exit 1
            fi

  test-connectivity:
    description: "Test Squid proxy access control using curl"
    steps:
      - run:
          name: "Test CircleCI domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing CircleCI domains (Expected: ALLOWED)"
            echo "=============================================="
            
            echo "Checking if Squid is running..."
            pgrep squid || echo "Squid not running!"
            
            echo "Checking port 3128..."
            sudo lsof -i :3128 || echo "Nothing on port 3128"
            
            for domain in "circleci.com" "app.circleci.com" "api.circleci.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Trying without proxy..."
                curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null
                exit 1
              fi
            done
      
      - run:
          name: "Test GitHub domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing GitHub domains (Expected: ALLOWED)"
            echo "============================================="
            
            for domain in "github.com" "api.github.com" "raw.githubusercontent.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              
              if [ $? -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR"
                exit 1
              fi
            done
      
      - run:
          name: "Test Google domains (should be BLOCKED)"
          command: |
            echo "🔍 Testing Google domains (Expected: BLOCKED)"
            echo "============================================"
            
            echo "Checking Squid status..."
            pgrep squid || echo "Squid not running!"
            lsof -i :3128 || echo "Nothing listening on port 3128"
            
            for domain in "google.com" "www.google.com" "gmail.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              
              if [ $? -eq 0 ] && [ "$response" != "000" ]; then
                echo "❌ UNEXPECTEDLY ALLOWED (HTTP $response)"
                echo "Trying without proxy to compare..."
                curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null
                exit 1
              else
                echo "✅ BLOCKED"
              fi
            done
      
      - run:
          name: "Test summary and cleanup"
          command: |
            echo ""
            echo "🎉 All tests completed successfully!"
            echo "=================================="
            echo "✅ CircleCI and GitHub domains are accessible"
            echo "✅ Google and other domains are blocked"
            echo ""
            echo "Squid proxy is working correctly!"
            
            echo ""
            echo "🎉 Squid proxy test completed successfully!"

jobs:
  test-squid-proxy:
    executor: machine
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-macos:
    executor: macos
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-docker:
    executor: docker
    steps:
      - checkout
      - setup-squid
      - test-connectivity

workflows:
  test-proxy-access-control:
    jobs:
      - test-squid-proxy
      - test-squid-proxy-macos
      - test-squid-proxy-docker