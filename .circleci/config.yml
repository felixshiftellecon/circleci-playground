version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

parameters:
  gradle_version:
    type: string
    default: "8.12"

jobs:
  job_b:
    executor: base
    steps:
      - checkout
      - run: mkdir tmp_build/<< pipeline.parameters.gradle_version >>
      - run: exit 1
      - save_cache:
          key: cache-key
          path: tmp_build/<< pipeline.parameters.gradle_version >>

workflows:
  workflow-a:
    jobs:
      - job_b