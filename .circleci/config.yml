version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    parameters:
      cache_prefix:
        default: v1
        description: >-
          The prefix string used to set for the dependency cache. Change string to
          save data in a new cache.
        type: string
    steps:
      - checkout
      - run: echo "Running job a"
      - restore_cache:
          paths:
            - path_a
          keys: 
            - <<parameters.cache_prefix>>-cache-path-a-{{ .Branch }}
            - <<parameters.cache_prefix>>-cache-path-a-main
            - <<parameters.cache_prefix>>-cache-path-a-
      - run: cat path_a/README.md
      - save_cache:
          paths:
            - path_a
          key: <<parameters.cache_prefix>>-cache-path-a-{{ .Branch }}


workflows:
  workflow-a:
    jobs:
      - job_a