version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: touch file.txt
      - run:
          background: true
          command: sleep 10000
      - save_cache:
          key: myapp-v1{{ .Branch }}
          background: true
          paths:
            - file.txt
            - .git
      - run: echo "im done"

  job_b:
    executor: base
    steps:
      - checkout
      - restore_cache:
          key: myapp-{{ .Branch }}-{{ checksum "README.md" }}
      - run: echo "running job b"
      - run: cat path_b/README.md

workflows:
  workflow-a:
    jobs:
      - job_a
      - job_b