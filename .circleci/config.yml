version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: "16.0.0"
    resource_class: m4pro.medium
  docker:
    docker:
      - image: cimg/base:2025.07

commands:
  setup-squid:
    description: "Install and start Squid proxy"
    steps:
      - run:
          name: "Install Squid and start proxy"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              brew install squid curl
              # Create log directory for macOS
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
            else
              sudo apt-get update
              sudo apt-get install -y squid curl
              # Create log directory for Linux
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
            fi
            
            echo "Starting Squid with configuration..."
            
            # Check if port 3128 is already in use
            echo "Checking if port 3128 is available..."
            if netstat -tlnp 2>/dev/null | grep -q :3128 || lsof -i :3128 2>/dev/null; then
              echo "❌ Port 3128 is already in use:"
              netstat -tlnp 2>/dev/null | grep :3128 || lsof -i :3128 2>/dev/null
              exit 1
            else
              echo "✅ Port 3128 is available"
            fi
            
            # Use different flags for Docker to avoid PID file issues
            if [[ -f /.dockerenv ]]; then
              # Docker environment - avoid PID file issues
              squid -f squid.conf -N -d 1 &
            else
              # Regular environment
              squid -f squid.conf -N -d 1 &
            fi
            SQUID_PID=$!
            echo "Squid started with PID: $SQUID_PID"
            
            # Wait for Squid to start and check port availability
            echo "Waiting for Squid to start..."
            for i in {1..10}; do
              if pgrep squid > /dev/null; then
                echo "Squid process found, checking port..."
                if netstat -tlnp 2>/dev/null | grep -q :3128 || lsof -i :3128 2>/dev/null; then
                  echo "✅ Squid is listening on port 3128"
                  break
                else
                  echo "Squid running but port not ready yet (attempt $i/10)..."
                  sleep 1
                fi
              else
                echo "Squid process not found (attempt $i/10)..."
                sleep 1
              fi
            done
            
            # Final check if Squid is running
            if pgrep squid > /dev/null; then
              echo "✅ Squid process is running"
              echo "Checking port 3128..."
              netstat -tlnp 2>/dev/null | grep :3128 || lsof -i :3128 2>/dev/null || echo "Port 3128 not found"
              
              # Check what ports Squid is actually listening on
              echo "Checking what ports Squid is listening on:"
              netstat -tlnp 2>/dev/null | grep squid || lsof -i -P 2>/dev/null | grep squid || echo "No Squid listening ports found"
              
              # Check Squid logs for startup errors
              echo "Checking Squid logs:"
              tail -n 10 /var/log/squid/cache.log 2>/dev/null || echo "No cache log found"
              tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
              
              # If Squid is running but not on port 3128, it's a configuration issue
              if ! netstat -tlnp 2>/dev/null | grep -q :3128 && ! lsof -i :3128 2>/dev/null; then
                echo "❌ Squid is running but not listening on port 3128"
                echo "This indicates a configuration error"
                exit 1
              fi
            else
              echo "❌ Squid failed to start"
              echo "Checking for errors..."
              tail -n 20 /var/log/squid/cache.log 2>/dev/null || echo "No cache log found"
              exit 1
            fi

  test-connectivity:
    description: "Test Squid proxy access control using curl"
    steps:
      - run:
          name: "Test CircleCI domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing CircleCI domains (Expected: ALLOWED)"
            echo "=============================================="
            
            echo "Checking if Squid is running..."
            pgrep squid || echo "Squid not running!"
            
            echo "Checking port 3128..."
            netstat -tlnp 2>/dev/null | grep :3128 || lsof -i :3128 2>/dev/null || echo "Nothing on port 3128"
            
            # Test with retry logic
            for domain in "circleci.com" "app.circleci.com" "api.circleci.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              fi
            done
      
      - run:
          name: "Test GitHub domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing GitHub domains (Expected: ALLOWED)"
            echo "============================================="
            
            for domain in "github.com" "api.github.com" "raw.githubusercontent.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              fi
            done
      
      - run:
          name: "Test Google domains (should be BLOCKED)"
          command: |
            echo "🔍 Testing Google domains (Expected: BLOCKED)"
            echo "============================================"
            
            echo "Checking Squid status..."
            pgrep squid || echo "Squid not running!"
            netstat -tlnp 2>/dev/null | grep :3128 || lsof -i :3128 2>/dev/null || echo "Nothing listening on port 3128"
            
            for domain in "google.com" "www.google.com" "gmail.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "❌ UNEXPECTEDLY ALLOWED (HTTP $response)"
                echo "Checking Squid logs..."
                tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              else
                echo "✅ BLOCKED (curl exit: $curl_exit_code, response: $response)"
              fi
            done
      
      - run:
          name: "Test summary and cleanup"
          command: |
            echo ""
            echo "🎉 All tests completed successfully!"
            echo "=================================="
            echo "✅ CircleCI and GitHub domains are accessible"
            echo "✅ Google and other domains are blocked"
            echo ""
            echo "Squid proxy is working correctly!"
            
            echo ""
            echo "🎉 Squid proxy test completed successfully!"

jobs:
  test-squid-proxy:
    executor: machine
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-macos:
    executor: macos
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-docker:
    executor: docker
    steps:
      - checkout
      - setup-squid
      - test-connectivity

workflows:
  test-proxy-access-control:
    jobs:
      - test-squid-proxy
      - test-squid-proxy-macos
      - test-squid-proxy-docker