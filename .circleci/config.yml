version: 2.1

# Parameter test — SETUP pipeline.
# Exercises pipeline parameters via TWO paths:
#   Path 1 (API/UI):  parameters supplied to THIS setup pipeline at trigger time.
#   Path 2 (continue): parameters forwarded into the continued config through
#                      continuation/continue's `parameters` arg (the continue API).

setup: true

orbs:
  continuation: circleci/continuation@1.0.0

parameters:
  # Supply at trigger time, e.g. API v2 POST .../pipeline/run:
  #   { "parameters": { "test-value": "hello", "test-number": 7 } }
  test-value:
    type: string
    default: default-from-config
  test-number:
    type: integer
    default: 0
  # When true, the setup job forwards a 513-char value to the continue API,
  # which should reject it (>512) -> the "Continue Pipeline" step fails VISIBLY
  # in the UI on this setup pipeline.
  force-overlong:
    type: boolean
    default: false

jobs:
  show-and-continue:
    docker:
      - image: cimg/base:stable
    environment:
      TEST_VALUE: << pipeline.parameters.test-value >>
    steps:
      - checkout
      - run:
          name: "Path 1 - params received by the SETUP pipeline"
          command: |
            echo "test-value   = ${TEST_VALUE}"
            echo "value length = ${#TEST_VALUE}"
            echo "test-number  = << pipeline.parameters.test-number >>"
      - run:
          name: "Build continuation parameters (overlong toggle)"
          command: |
            if [ "<< pipeline.parameters.force-overlong >>" = "true" ]; then
              VALUE=$(printf 'x%.0s' $(seq 1 513))   # 513 chars -> exceeds the 512 limit
              echo "Forwarding an OVERLONG value: ${#VALUE} chars (expect continue API to REJECT)"
            else
              VALUE="${TEST_VALUE}"
              echo "Forwarding value: ${#VALUE} chars"
            fi
            jq -n --arg v "$VALUE" --argjson n "<< pipeline.parameters.test-number >>" \
              '{"forwarded-value": $v, "forwarded-number": $n}' > /tmp/continue-params.json
            echo "Wrote /tmp/continue-params.json (value length: ${#VALUE})"
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/continue-params.json

workflows:
  setup:
    jobs:
      - show-and-continue
