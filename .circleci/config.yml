version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_b:
    executor: base
    parameters:
      persist_to_workspace:
        default: true
        type: boolean
    steps:
      - checkout
      - run: mkdir tmp_build
      - run: exit 1
      - when:
          condition: << parameters.persist_to_workspace >>
          steps:
            - persist_to_workspace:
                paths: tmp_build/
                root: .

workflows:
  workflow-a:
    jobs:
      - job_b