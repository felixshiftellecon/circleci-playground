version: 2.1

setup: true

parameters:
  # Resolved into the path-filtering orb line before policy evaluation (API trigger to test pins).
  path_filtering_orb_pin:
    type: string
    default: "3.0.0"

orbs:
  path-filtering: circleci/path-filtering@<< pipeline.parameters.path_filtering_orb_pin >>
  continuation: circleci/continuation@0.2.0

workflows:
  setup-workflow:
    jobs:
      - path-filtering/filter:
          name: check path
          mapping: |
            path_a/.* run-path-a true
            path_b/.* run-path-b true
          base-revision: main
          config-path: .circleci/continue-config.yml
          filters:
            tags:
              ignore: /.*/
      - continuation/continue:
          name: Continue from Tag
          configuration_path: .circleci/continue_config.yml
          filters:
            tags:
              only: /.*/
            branches:
              ignore: /.*/
      - continuation/continue:
          name: Continue from API
          configuration_path: ./.circleci/continue_config.yml
          filters:
            tags:
              ignore: /.*/
            branches:
              ignore: /.*/
