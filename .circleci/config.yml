version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: "16.0.0"
    resource_class: m4pro.medium
  docker:
    docker:
      - image: cimg/base:2025.07

commands:
  setup-squid:
    description: "Install and configure Squid proxy with CircleCI/GitHub access control"
    steps:
      - run:
          name: "Install Squid and curl"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              brew install squid curl
            else
              sudo apt-get update
              sudo apt-get install -y squid curl
            fi
      
      - run:
          name: "Create Squid directories"
          command: |
            sudo mkdir -p /var/spool/squid /var/log/squid
            sudo chown -R $(whoami):$(id -gn) /var/spool/squid /var/log/squid
      
      - run:
          name: "Install Squid configuration"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              sudo mkdir -p /usr/local/etc/squid
              sudo cp squid.conf /usr/local/etc/squid/squid.conf
              sudo mkdir -p /var/log/squid
              sudo chown -R $(whoami):$(id -gn) /var/log/squid
            else
              sudo cp squid.conf /etc/squid/squid.conf
            fi
            
            sudo pkill -f squid || true
            sudo pkill squid || true
            sleep 3
            
            if [[ "$OSTYPE" == "darwin"* ]]; then
              sudo rm -f /opt/homebrew/var/run/squid.pid
            else
              sudo rm -f /run/squid.pid
              sudo rm -f /var/run/squid.pid
              sudo rm -f /var/spool/squid/squid.pid
            fi
            
            sudo squid -z
            
            sudo squid -k parse
            
            if [[ "$OSTYPE" == "darwin"* ]]; then
              sudo squid -d 1 -f /usr/local/etc/squid/squid.conf -u $(whoami) -g $(id -gn)
              echo "Squid started with explicit config and user"
            else
              sudo systemctl start squid
            fi
            
            sleep 5
            
            if pgrep squid > /dev/null; then
              echo "✅ Squid is running"
              echo "Checking if Squid is listening on port 3128..."
              sudo lsof -i :3128 || echo "WARNING: Squid not listening on port 3128"
              
              if [[ "$OSTYPE" == "darwin"* ]]; then
                echo "Squid logs:"
                tail -10 /usr/local/var/logs/squid/cache.log 2>/dev/null || echo "No cache log found"
              else
                echo "Squid logs:"
                sudo tail -10 /var/log/squid/cache.log 2>/dev/null || echo "No cache log found"
              fi
            else
              echo "❌ Squid failed to start"
              exit 1
            fi

  test-connectivity:
    description: "Test Squid proxy access control using curl"
    steps:
      - run:
          name: "Test CircleCI domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing CircleCI domains (Expected: ALLOWED)"
            echo "=============================================="
            
            echo "Checking if Squid is running..."
            pgrep squid || echo "Squid not running!"
            
            echo "Checking port 3128..."
            sudo lsof -i :3128 || echo "Nothing on port 3128"
            
            for domain in "circleci.com" "app.circleci.com" "api.circleci.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Trying without proxy..."
                curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null
                exit 1
              fi
            done
      
      - run:
          name: "Test GitHub domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing GitHub domains (Expected: ALLOWED)"
            echo "============================================="
            
            for domain in "github.com" "api.github.com" "raw.githubusercontent.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              
              if [ $? -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR"
                exit 1
              fi
            done
      
      - run:
          name: "Test Google domains (should be BLOCKED)"
          command: |
            echo "🔍 Testing Google domains (Expected: BLOCKED)"
            echo "============================================"
            
            for domain in "google.com" "www.google.com" "gmail.com"; do
              echo -n "Testing $domain: "
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              
              if [ $? -eq 0 ] && [ "$response" != "000" ]; then
                echo "❌ UNEXPECTEDLY ALLOWED (HTTP $response)"
                exit 1
              else
                echo "✅ BLOCKED"
              fi
            done
      
      - run:
          name: "Test summary and cleanup"
          command: |
            echo ""
            echo "🎉 All tests completed successfully!"
            echo "=================================="
            echo "✅ CircleCI and GitHub domains are accessible"
            echo "✅ Google and other domains are blocked"
            echo ""
            echo "Squid proxy is working correctly!"
            
            echo ""
            echo "📋 Recent Squid access logs:"
            if [[ "$OSTYPE" == "darwin"* ]]; then
              tail -5 /usr/local/var/logs/squid/access.log 2>/dev/null || echo "No access logs found"
            else
              sudo tail -5 /var/log/squid/access.log 2>/dev/null || echo "No access logs found"
            fi

jobs:
  test-squid-proxy:
    executor: machine
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-macos:
    executor: macos
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-docker:
    executor: docker
    steps:
      - checkout
      - setup-squid
      - test-connectivity

workflows:
  test-proxy-access-control:
    jobs:
      - test-squid-proxy
      - test-squid-proxy-macos
      - test-squid-proxy-docker