version: 2.1

# OAuth repro for checkout + HTTPS clone credential behavior.
# Org: gh/felixshiftellecon (GitHub OAuth, not GitHub App standalone).
# Branch: test/checkout-oauth-credential-repro

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  checkout-credential-repro:
    executor: base
    resource_class: small
    steps:
      - checkout:
          path: /tmp/deps/service-repository
      - run:
          name: Diagnose git config after checkout
          command: |
            set -xuo pipefail
            echo "=== org slug (expect gh/felixshiftellecon for OAuth) ==="
            echo "${CIRCLE_PROJECT_REPONAME} @ ${CIRCLE_PROJECT_USERNAME}"
            echo "=== git config after checkout ==="
            git config --global --list || true
            echo "=== checked-out repo remote ==="
            git -C /tmp/deps/service-repository remote -v
      - run:
          name: Install github.com HTTPS credential helper (workflows-orb pattern)
          command: |
            set -euo pipefail
            CRED_HELPER="${HOME}/.git-credential-github.sh"
            printf '%s\n' \
              '#!/bin/bash' \
              'case "$1" in' \
              '  get)' \
              '    echo "username=x-access-token"' \
              '    echo "password=${GITHUB_TOKEN}"' \
              '    ;;' \
              'esac' \
              > "${CRED_HELPER}"
            chmod 700 "${CRED_HELPER}"
            git config --global credential."https://github.com".helper "${CRED_HELPER}"
            git config --global --add url."https://github.com/".insteadOf "git@github.com:"
            git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
            echo "=== git config after helper install ==="
            git config --global --list
            cat "${CRED_HELPER}"
      - run:
          name: Clone same repo over HTTPS
          command: |
            set -xuo pipefail
            rm -rf /tmp/deps/same-repo
            git clone --depth 1 "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" /tmp/deps/same-repo
            echo "same-repo clone: OK"
      - run:
          name: Clone different private repo over HTTPS
          command: |
            set -xuo pipefail
            rm -rf /tmp/deps/other-private-repo
            git clone --depth 1 https://github.com/felixshiftellecon/private-circleci-playground.git /tmp/deps/other-private-repo
            echo "other-private-repo clone: OK"

workflows:
  checkout_credential_repro:
    jobs:
      - checkout-credential-repro
