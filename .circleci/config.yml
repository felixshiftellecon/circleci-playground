version: 2.1


executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: echo "Running job a"
  job_b:
    executor: base
    steps:
      - checkout
      - run: echo "running job b"
  get_step_logs:
    executor: base
    parameters:
      test:
        type: string
    steps:
      - checkout
      - run: echo <<parameters.test>>
      - run: bash .circleci/step_output_logger.sh
      - store_artifacts:
          path: build_logs/

workflows:
  workflow-a:
    jobs:
      - job_a
      - job_b
      - get_step_logs:
          requires:
            - job_a
            - job_b
          context:
            - orb-publishing