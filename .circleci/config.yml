version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  i_send_to_3rd_party:
    executor: base
    steps:
      - checkout
      - run: echo "I sent stuff to a 3rd party"
  i_poll_3rd_party:
    executor: base
    steps:
      - checkout
      - run: echo "I'm polling for the stuff sent to a 3rd party"
      - run: echo "but then I fail"
      - run: exit 1
      - run:
          when: on_fail
          name: Rerun workflow starting at i_send_to_3rd_party
          command: |
            API="https://circleci.com/api/v2"
            AUTH="Circle-Token: ${CIRCLE_TOKEN}"
            J=$(curl -s -H "$AUTH" "$API/workflow/${CIRCLE_WORKFLOW_ID}/job")
            SEND=$(echo "$J" | jq -r '.items[] | select(.name=="i_send_to_3rd_party") | .id')
            POLL=$(echo "$J" | jq -r '.items[] | select(.name=="i_poll_3rd_party") | .id')
            curl -s -H "$AUTH" -H "Content-Type: application/json" -X POST -d '{"from_failed":false,"jobs":["'"$SEND"'","'"$POLL"'"]}' "$API/workflow/${CIRCLE_WORKFLOW_ID}/rerun"

workflows:
  workflow-a:
    jobs:
      - i_send_to_3rd_party
      - i_poll_3rd_party:
          requires:
            - i_send_to_3rd_party
          context: api_token