version: 2.1

parameters:
  run-path-a:
    type: boolean
    default: false
  run-path-b:
    type: boolean
    default: false

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: 15.0

commands:
  setup-linux-firewall:
    description: "Setup iptables firewall restrictions for Linux environments"
    steps:
      - run:
          name: "Configure iptables firewall rules"
          command: |
            echo "Setting up iptables firewall rules for Linux..."
            echo "Starting at: $(date)"
            
            # Check if iptables is available
            if ! command -v iptables >/dev/null 2>&1; then
              echo "ERROR: iptables not found"
              exit 1
            fi
            
            echo "Flushing existing rules..."
            timeout 30 sudo iptables -F || echo "Warning: flush failed"
            timeout 30 sudo iptables -X || echo "Warning: clear failed"
            
            echo "Setting default policies..."
            timeout 30 sudo iptables -P INPUT DROP || echo "Warning: INPUT policy failed"
            timeout 30 sudo iptables -P FORWARD DROP || echo "Warning: FORWARD policy failed"
            timeout 30 sudo iptables -P OUTPUT DROP || echo "Warning: OUTPUT policy failed"
            
            echo "Adding loopback rules..."
            timeout 30 sudo iptables -A INPUT -i lo -j ACCEPT || echo "Warning: INPUT loopback failed"
            timeout 30 sudo iptables -A OUTPUT -o lo -j ACCEPT || echo "Warning: OUTPUT loopback failed"
            
            echo "Adding established connection rules..."
            timeout 30 sudo iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT || echo "Warning: INPUT established failed"
            timeout 30 sudo iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT || echo "Warning: OUTPUT established failed"
            
            echo "Adding DNS rules..."
            timeout 30 sudo iptables -A OUTPUT -p udp --dport 53 -j ACCEPT || echo "Warning: DNS out failed"
            timeout 30 sudo iptables -A INPUT -p udp --sport 53 -j ACCEPT || echo "Warning: DNS in failed"
            
            echo "Adding CircleCI domain rules..."
            timeout 30 sudo iptables -A OUTPUT -d circleci.com -j ACCEPT || echo "Warning: circleci.com failed"
            timeout 30 sudo iptables -A OUTPUT -d api.circleci.com -j ACCEPT || echo "Warning: api.circleci.com failed"
            timeout 30 sudo iptables -A OUTPUT -d cimg.io -j ACCEPT || echo "Warning: cimg.io failed"
            
            echo "Adding GitHub domain rules..."
            timeout 30 sudo iptables -A OUTPUT -d github.com -j ACCEPT || echo "Warning: github.com failed"
            timeout 30 sudo iptables -A OUTPUT -d githubusercontent.com -j ACCEPT || echo "Warning: githubusercontent.com failed"
            
            echo "Iptables setup completed at: $(date)"
            echo "iptables firewall rules applied successfully"
      - run:
          name: "Verify iptables rules"
          command: |
            echo "=== VERIFYING IPTABLES RULES ==="
            echo "Current OUTPUT chain rules:"
            sudo iptables -L OUTPUT -n -v || echo "Failed to list OUTPUT rules"
            
            echo "Current policies:"
            sudo iptables -L -n | grep -E "(Chain|policy)" || echo "Failed to list policies"
            
            echo "Testing if OUTPUT policy is DROP:"
            if sudo iptables -L OUTPUT -n | grep -q "policy DROP"; then
              echo "✓ OUTPUT policy is correctly set to DROP"
            else
              echo "✗ OUTPUT policy is NOT set to DROP"
              echo "Current OUTPUT policy:"
              sudo iptables -L OUTPUT -n | grep policy
            fi
            
            echo "Number of OUTPUT rules:"
            sudo iptables -L OUTPUT -n | grep -v "Chain\|policy" | wc -l || echo "Failed to count rules"
            
            echo "=== END VERIFICATION ==="
      - run:
          name: "Alternative iptables approach (if needed)"
          command: |
            echo "=== ALTERNATIVE IPTABLES APPROACH ==="
            
            # Check if OUTPUT policy is DROP, if not, try alternative approach
            if ! sudo iptables -L OUTPUT -n | grep -q "policy DROP"; then
              echo "OUTPUT policy is not DROP, trying alternative approach..."
              
              # Create iptables rules file
              cat > /tmp/iptables-rules \<< 'EOF'
              *filter
              :INPUT DROP [0:0]
              :FORWARD DROP [0:0]
              :OUTPUT DROP [0:0]
              -A INPUT -i lo -j ACCEPT
              -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
              -A OUTPUT -o lo -j ACCEPT
              -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
              -A OUTPUT -p udp --dport 53 -j ACCEPT
              -A INPUT -p udp --sport 53 -j ACCEPT
              -A OUTPUT -d circleci.com -j ACCEPT
              -A OUTPUT -d api.circleci.com -j ACCEPT
              -A OUTPUT -d cimg.io -j ACCEPT
              -A OUTPUT -d github.com -j ACCEPT
              -A OUTPUT -d githubusercontent.com -j ACCEPT
              -A OUTPUT -p tcp --dport 80 -j ACCEPT
              -A OUTPUT -p tcp --dport 443 -j ACCEPT
              COMMIT
              EOF
              
              # Apply rules using iptables-restore
              sudo iptables-restore < /tmp/iptables-rules
              echo "Alternative rules applied using iptables-restore"
            else
              echo "OUTPUT policy is already DROP, skipping alternative approach"
            fi
            
            echo "=== END ALTERNATIVE APPROACH ==="

  setup-macos-firewall:
    description: "Setup pf firewall restrictions for macOS environments"
    steps:
      - run:
          name: "Configure pf firewall rules"
          command: |
            echo "Setting up pf firewall rules for macOS..."
            
            # Get actual IP addresses for the domains we need
            echo "Resolving domain IPs..."
            CIRCLE_IP=$(dig +short circleci.com | head -1)
            GITHUB_IP=$(dig +short github.com | head -1)
            
            echo "CircleCI IP: $CIRCLE_IP"
            echo "GitHub IP: $GITHUB_IP"
            
            # Create a simple pf rules file without YAML indentation
            echo "# Simple pf configuration for CircleCI" > /tmp/circleci-pf.conf
            echo "block drop all" >> /tmp/circleci-pf.conf
            echo "pass quick on lo0 all" >> /tmp/circleci-pf.conf
            
            # Allow DNS
            echo "pass out proto udp from any to any port 53" >> /tmp/circleci-pf.conf
            
            # Allow CircleCI and GitHub by IP address
            if [ ! -z "$CIRCLE_IP" ]; then
              echo "pass out proto tcp from any to $CIRCLE_IP port 80" >> /tmp/circleci-pf.conf
              echo "pass out proto tcp from any to $CIRCLE_IP port 443" >> /tmp/circleci-pf.conf
            fi
            
            if [ ! -z "$GITHUB_IP" ]; then
              echo "pass out proto tcp from any to $GITHUB_IP port 80" >> /tmp/circleci-pf.conf
              echo "pass out proto tcp from any to $GITHUB_IP port 443" >> /tmp/circleci-pf.conf
            fi
            
            # Apply pf rules (requires sudo)
            sudo pfctl -q -f /tmp/circleci-pf.conf
            
            # Only enable pf if it's not already enabled
            if ! sudo pfctl -s info | grep -q "Status: Enabled"; then
              sudo pfctl -q -e
            else
              echo "pf is already enabled, skipping enable step"
            fi
            
            echo "pf firewall rules applied successfully"

  test-connectivity:
    description: "Test connectivity to verify firewall restrictions are working"
    steps:
      - run:
          name: "Debug firewall status"
          command: |
            echo "=== DEBUGGING FIREWALL STATUS ==="
            echo "Current time: $(date)"
            
            # Check if we're on Linux or macOS
            if [[ "$OSTYPE" == "darwin"* ]]; then
              echo "Platform: macOS"
              echo "pf status:"
              sudo pfctl -s info 2>/dev/null || echo "pfctl not available"
              echo "pf rules:"
              sudo pfctl -s rules 2>/dev/null || echo "pfctl rules not available"
            else
              echo "Platform: Linux"
              echo "iptables status:"
              sudo iptables -L -n -v 2>/dev/null || echo "iptables not available"
              echo "iptables policies:"
              sudo iptables -L -n | grep -E "(Chain|policy)" 2>/dev/null || echo "iptables policies not available"
            fi
            
            echo "=== NETWORK DEBUGGING ==="
            echo "DNS resolution test:"
            nslookup google.com 8.8.8.8 2>/dev/null || echo "nslookup failed"
            
            echo "Route to google.com:"
            traceroute -m 5 google.com 2>/dev/null || echo "traceroute failed"
            
            echo "=== END DEBUGGING ==="
      - run:
          name: "Test blocked domains (google.com)"
          command: |
            echo "Testing connectivity to google.com (should fail due to restrictions)..."
            echo "Test started at: $(date)"
            
            # Use timeout to prevent hanging
            if timeout 10 curl -s --connect-timeout 5 --max-time 10 https://google.com > /dev/null 2>&1; then
              echo "WARNING: google.com is reachable - firewall restrictions may not be working"
              echo "This could mean:"
              echo "1. Firewall rules weren't applied correctly"
              echo "2. Rules are being bypassed"
              echo "3. Network routing is different than expected"
              exit 1
            else
              echo "SUCCESS: google.com is blocked as expected"
            fi
            echo "Test completed at: $(date)"
      - run:
          name: "Test allowed domains (CircleCI & GitHub)"
          command: |
            echo "Testing connectivity to allowed domains..."
            echo "Test started at: $(date)"
            
            echo "Testing CircleCI..."
            if timeout 10 curl -s --connect-timeout 5 --max-time 10 https://circleci.com > /dev/null 2>&1; then
              echo "SUCCESS: CircleCI is reachable"
            else
              echo "ERROR: CircleCI is not reachable"
              exit 1
            fi
            
            echo "Testing GitHub..."
            if timeout 10 curl -s --connect-timeout 5 --max-time 10 https://github.com > /dev/null 2>&1; then
              echo "SUCCESS: GitHub is reachable"
            else
              echo "ERROR: GitHub is not reachable"
              exit 1
            fi
            
            echo "Test completed at: $(date)"

jobs:
  machine:
    executor: machine
    steps:
      - setup-linux-firewall
      - test-connectivity
      - checkout
  macos:
    executor: macos
    steps:
      - setup-macos-firewall
      - test-connectivity
      - checkout

workflows:
  workflow-a:
    jobs:
      - machine
      - macos