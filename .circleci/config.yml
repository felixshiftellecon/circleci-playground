version: 2.1

parameters:
  run-path-a:
    type: boolean
    default: false
  run-path-b:
    type: boolean
    default: false

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  no-version-set:
    executor: base
    resource_class: medium.gen2
    steps:
      - setup_remote_docker
      - run: docker --version
  version-default:
    executor: base
    resource_class: medium.gen2
    steps:
      - setup_remote_docker:
          version: default
      - run: docker --version
  version-edge:
    executor: base
    resource_class: medium.gen2
    steps:
      - setup_remote_docker:
          version: edge
      - run: docker --version
  version-24:
    executor: base
    resource_class: medium.gen2
    steps:
      - setup_remote_docker:
          version: docker24
      - run: docker --version

workflows:
  remote-docker-version-test:
    jobs:
      - no-version-set
      - version-default
      - version-26