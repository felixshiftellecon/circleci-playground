version: 2.1


executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: echo "Running job a"
      - run: cat path_a/README.md
  job_b:
    executor: base
    steps:
      - checkout
      - run: echo "running job b"
      - run: cat path_b/README.md

workflows:
  workflow-a:
    jobs:
      - job_a
      - hold:
          type: approval
          requires:
            - job_a
          filter: pipeline.git.branch == "main"
      - job_b:
          requires:
            - hold