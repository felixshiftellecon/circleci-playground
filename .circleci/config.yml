version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: "16.0.0"
    resource_class: m4pro.medium
  docker:
    docker:
      - image: cimg/base:2025.07

commands:
  setup-squid:
    description: "Install and start Squid proxy"
    steps:
      - run:
          name: "Install Squid and start proxy"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              brew install squid curl
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
            else
              echo "Linux detected - installing Squid and curl..."
              echo "Current directory: $(pwd)"
              echo "System info: $(uname -a)"
              echo "Available memory: $(free -h)"
              echo "Disk space: $(df -h)"
              
              sudo apt-get update
              sudo apt-get install -y squid curl
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
              
              echo "Stopping any existing Squid processes..."
              sudo pkill squid 2>/dev/null || true
              sleep 2
            fi
            
            echo "Starting Squid with configuration..."
            
            echo "Cleaning up any existing Squid processes..."
            sudo pkill squid 2>/dev/null || true
            sleep 2
            
            echo "Starting Squid..."
            if [[ "$OSTYPE" == "darwin"* ]]; then
              echo "macOS detected - starting Squid"
              squid -f squid.conf -N -d 1 &
            elif [[ -f /.dockerenv ]]; then
              echo "Docker detected - starting Squid"
              squid -f squid.conf -N -d 1 &
            else
              echo "Linux detected - starting Squid"
              echo "Current directory: $(pwd)"
              echo "Squid config file exists: $(ls -la squid.conf 2>/dev/null || echo 'squid.conf not found')"
              echo "Changing to project directory..."
              cd /home/circleci/project
              echo "New directory: $(pwd)"
              echo "Squid config file exists: $(ls -la squid.conf 2>/dev/null || echo 'squid.conf not found')"
              echo "Starting Squid with config..."
              sudo squid -f squid.conf -N -d 1 &
            fi
            SQUID_PID=$!
            echo "Squid started with PID: $SQUID_PID"
            
            echo "Waiting for Squid to start..."
            sleep 3
            
            if pgrep squid > /dev/null; then
              echo "✅ Squid is running"
              
              echo "Setting up network-level proxy enforcement..."
              if [[ "$OSTYPE" == "darwin"* ]]; then
                echo "macOS: Setting up pf rules to enforce proxy"
                ./setup_pf_rules.sh

                echo "Enabling proxy environment variables for subsequent steps…"
                {
                  echo 'export http_proxy="http://127.0.0.1:3128"'
                  echo 'export https_proxy="http://127.0.0.1:3128"'
                  echo 'export no_proxy="127.0.0.1,localhost"'
                } >> "$BASH_ENV"
                source "$BASH_ENV"
              else
                echo "Linux: Setting up iptables rules to redirect traffic to proxy"
                ./setup_iptables_rules.sh

                echo "Enabling proxy environment variables for subsequent steps… (Linux)"
                {
                  echo 'export http_proxy="http://127.0.0.1:3128"'
                  echo 'export https_proxy="http://127.0.0.1:3128"'
                  echo 'export no_proxy="127.0.0.1,localhost"'
                } >> "$BASH_ENV"
                source "$BASH_ENV"
              fi
            else
              echo "❌ Squid failed to start"
              exit 1
            fi

  test-connectivity:
    description: "Test Squid proxy access control using curl"
    steps:
      - run:
          name: "Test CircleCI domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing CircleCI domains (Expected: ALLOWED)"
            echo "=============================================="
            
            echo "Checking if Squid is running..."
            pgrep squid || echo "Squid not running!"
            
            echo "Checking ports 3128 and 3129..."
            lsof -i :3128 2>/dev/null || ss -tlnp 2>/dev/null | grep :3128 || echo "Nothing on port 3128"
            lsof -i :3129 2>/dev/null || ss -tlnp 2>/dev/null | grep :3129 || echo "Nothing on port 3129"
            
            for domain in "circleci.com" "app.circleci.com" "api.circleci.com"; do
              echo -n "Testing $domain: "
              
              echo "Testing direct connection to $domain..."
              response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi
              
              echo "curl exit code: $curl_exit_code, response: $response"
              
              echo "=== Squid Access Logs (last 5 entries) ==="
              sudo tail -n 5 /var/log/squid/access.log 2>/dev/null || echo "No access logs found"
              echo "=== End Squid Access Logs ==="
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                exit 1
              fi
            done
            
            echo "✅ All CircleCI domain tests completed"
      
      - run:
          name: "Test GitHub domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing GitHub domains (Expected: ALLOWED)"
            echo "============================================="
            
            for domain in "github.com" "api.github.com" "raw.githubusercontent.com"; do
              echo -n "Testing $domain: "
              
              response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi
              
              echo "curl exit code: $curl_exit_code, response: $response"
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                exit 1
              fi
            done
            
            echo "✅ All GitHub domain tests completed"
      
      - run:
          name: "Test Google domains (should be BLOCKED)"
          command: |
            echo "🔍 Testing Google domains (Expected: BLOCKED)"
            echo "============================================"
            
            echo "Checking Squid status..."
            pgrep squid || echo "Squid not running!"
            lsof -i :3128 2>/dev/null || ss -tlnp 2>/dev/null | grep :3128 || echo "Nothing listening on port 3128"
            lsof -i :3129 2>/dev/null || ss -tlnp 2>/dev/null | grep :3129 || echo "Nothing listening on port 3129"
            
            for domain in "google.com" "www.google.com" "gmail.com"; do
              echo -n "Testing $domain: "
              
              set +e  # tolerate non-zero exit while capturing it
              response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              set -e  # restore default safety

              # If curl failed completely, its http_code will be empty; normalise
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi

              echo "curl exit: $curl_exit_code, response: $response"

              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "❌ UNEXPECTEDLY ALLOWED (HTTP $response)"
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                exit 1
              else
                echo "✅ BLOCKED (as expected)"
                sudo tail -n 5 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
              fi
            done
            
            echo "✅ All Google domain tests completed"
      
      - run:
          name: "Debug network redirection and test explicit proxy"
          command: |
            echo "🔍 Debugging Network Redirection"
            echo "================================"
            
            echo "1. Checking if requests are going through Squid..."
            echo "Making a test request to httpbin.org..."
            curl -s -o /dev/null -w "Direct request: %{http_code}\n" --connect-timeout 5 "https://httpbin.org/status/200" 2>/dev/null || echo "Direct request failed"
            
            echo "2. Checking Squid access logs for the request..."
            echo "=== Squid Access Logs (last 10 entries) ==="
            sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access logs found"
            echo "=== End Squid Access Logs ==="
            
            echo "3. Testing explicit proxy connections..."
            echo "Testing allowed domain via explicit proxy:"
            curl -s -o /dev/null -w "Explicit proxy to circleci.com: %{http_code}\n" --proxy 127.0.0.1:3128 --connect-timeout 5 "https://circleci.com" 2>/dev/null || echo "Explicit proxy request failed"
            
            echo "Testing blocked domain via explicit proxy:"
            curl -s -o /dev/null -w "Explicit proxy to google.com: %{http_code}\n" --proxy 127.0.0.1:3128 --connect-timeout 5 "https://google.com" 2>/dev/null || echo "Explicit proxy request failed"
            
            echo "4. Checking network redirection rules..."
            if [[ "$OSTYPE" == "darwin"* ]]; then
              echo "=== macOS pf rules ==="
              sudo pfctl -s rules 2>/dev/null || echo "pfctl failed"
              sudo pfctl -s nat 2>/dev/null || echo "pfctl nat failed"
            else
              echo "=== Linux iptables rules ==="
              sudo iptables -t nat -L OUTPUT -n --line-numbers
              sudo iptables -L OUTPUT -n --line-numbers
            fi
            
            echo "5. Testing network redirection with curl..."
            echo "This should be redirected to Squid:"
            curl -s -o /dev/null -w "Redirected request: %{http_code}\n" --connect-timeout 5 "http://httpbin.org/status/200" 2>/dev/null || echo "Redirected request failed"
            
            echo "=== Final Squid Access Logs ==="
            sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access logs found"
            echo "=== End Final Squid Access Logs ==="

  test-caching:
    description: "Test caching"
    steps:
      - restore_cache:
          keys:
            - v1-test-cache
      - run:
          name: "Create a file to cache"
          command: |
            echo "This is a test file for caching." > test-file.txt
      - save_cache:
          key: v1-test-cache
          paths:
            - "test-file.txt"

jobs:
  squid-proxy-linux:
    executor: machine
    steps:
      - checkout
      - setup-squid
      - test-caching
      - test-connectivity

  squid-proxy-macos:
    executor: macos
    # No special environment variables needed
    steps:
      - checkout
      - setup-squid
      - test-caching
      - test-connectivity

workflows:
  test-proxy-access-control:
    jobs:
      - squid-proxy-linux
      - squid-proxy-macos