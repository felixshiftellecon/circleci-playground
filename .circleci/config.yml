version: 2.1

parameters:
  executor_being_used:
    type: string
    default: "small_boy"
  test_echo:
    type: string
    default: "yo"

executors:
  small_boy:
    macos:
      xcode: "15.4.0"
    resource_class: m2pro.medium
  big_boy:
    macos:
      xcode: "15.4.0"
    resource_class: m2pro.large


jobs:
  job_a:
    parameters:
      the_executor:
        type: executor
        default: small_boy
    executor: << parameters.the_executor >>
    steps:
      - checkout
      - run: echo << pipeline.parameters.test_echo >>
      - run: cat path_a/README.md

workflows:
  workflow-a:
    jobs:
      - job_a:
          the_executor: << pipeline.parameters.executor_being_used >>