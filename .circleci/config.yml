version: 2.1


executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: echo "Running job a"
  job_b:
    executor: base
    steps:
      - checkout
      - run: echo "running job b"
  get_logs:
    executor: base
    steps:
      - checkout
      - run: bash .circleci/job_output_logger.sh
      - store_artifacts:
          path: build_logs/

workflows:
  workflow-a:
    jobs:
      - job_a
      - job_b
      - get_logs:
          requires:
            - job_a
            - job_b