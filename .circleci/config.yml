version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - run: echo "I fail"
      - run: exit 1

  job_b:
    executor: base
    steps:
      - run: echo "I succeed"
  
  job_c:
    machine:
      image: ubuntu-2004:2024.01.2
    resource_class: 2xlarge+
    steps:
      - run: echo "I should run"
      - run: exit 1

workflows:
  workflow-a:
    jobs:
      - job_a
      - job_b
      - job_c:
          requires:
            - job_a:
                - failed
      - job_c:
          requires:
            - job_b:
                - failed
          