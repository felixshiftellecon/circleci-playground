version: 2.1


executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: echo "Running job a"

  job_b:
    executor: base
    steps:
      - checkout
      - run: echo "running job b"

  job_c:
    executor: base
    steps:
      - checkout
      - run: echo "running job c"

workflows:
  workflow-a:
    jobs:
      - job_a
      - hold:
          type: approval
          requires:
            - job_a
          filters: pipeline.git.branch == "main"
      - job_b:
          requires:
            - hold
  workflow-b:
    jobs:
      - job_a        
      - job_b:
          requires:
            - job_a
          filters: pipeline.git.branch == "main"
      - job_c:
          requires:
            - job_b
