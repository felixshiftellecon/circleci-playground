version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2204:2024.11.1
  macos:
    macos:
      xcode: "16.0.0"
    resource_class: m4pro.medium
  docker:
    docker:
      - image: cimg/base:2025.07

commands:
  setup-squid:
    description: "Install and start Squid proxy"
    steps:
      - run:
          name: "Install Squid and start proxy"
          command: |
            if [[ "$OSTYPE" == "darwin"* ]]; then
              brew install squid curl
              # Create log directory for macOS
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
            else
              sudo apt-get update
              sudo apt-get install -y squid curl
              # Create log directory for Linux
              sudo mkdir -p /var/log/squid
              sudo chown $(whoami) /var/log/squid
              
              # Simple cleanup - just like SSH
              echo "Stopping any existing Squid processes..."
              sudo pkill squid 2>/dev/null || true
              sleep 2
            fi
            
            echo "Starting Squid with configuration..."
            
            # Ensure we're using the correct config file
            if [[ "$OSTYPE" == "darwin"* ]]; then
              # macOS - use relative path
              CONFIG_FILE="squid.conf"
            else
              # Linux - use absolute path to ensure we get the right file
              CONFIG_FILE="/home/circleci/project/squid.conf"
            fi
            
            # Debug: Check configuration file
            echo "Checking Squid configuration file: $CONFIG_FILE"
            ls -la "$CONFIG_FILE"
            echo "Configuration file contents (first 10 lines):"
            head -10 "$CONFIG_FILE"
            
            # Test configuration syntax
            echo "Testing Squid configuration syntax..."
            squid -k parse -f "$CONFIG_FILE" 2>&1 || echo "Configuration syntax check failed"
            
            # Debug: Show what command we're about to run
            echo "About to start Squid with config file: $CONFIG_FILE"
            echo "OSTYPE: $OSTYPE"
            echo "Docker environment check: $([ -f /.dockerenv ] && echo "YES" || echo "NO")"
            
            # Simple cleanup - just like SSH
            echo "Cleaning up any existing Squid processes..."
            sudo pkill squid 2>/dev/null || true
            sleep 2
            
            # Start Squid - exactly like SSH
            echo "Starting Squid..."
            if [[ "$OSTYPE" == "darwin"* ]]; then
              echo "macOS detected - starting Squid"
              squid -f squid.conf -N -d 1 &
            elif [[ -f /.dockerenv ]]; then
              echo "Docker detected - starting Squid"
              squid -f squid.conf -N -d 1 &
            else
              echo "Linux detected - starting Squid"
              cd /home/circleci/project && sudo squid -f squid.conf -N -d 1 &
            fi
            SQUID_PID=$!
            echo "Squid started with PID: $SQUID_PID"
            
            # Simple wait - just like SSH
            echo "Waiting for Squid to start..."
            sleep 3
            
            # Simple check - just like SSH
            if pgrep squid > /dev/null; then
              echo "✅ Squid is running"
            else
              echo "❌ Squid failed to start"
              exit 1
            fi

  test-connectivity:
    description: "Test Squid proxy access control using curl"
    steps:
      - run:
          name: "Test CircleCI domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing CircleCI domains (Expected: ALLOWED)"
            echo "=============================================="
            
            echo "Checking if Squid is running..."
            pgrep squid || echo "Squid not running!"
            
            echo "Checking port 3128..."
            lsof -i :3128 2>/dev/null || ss -tlnp 2>/dev/null | grep :3128 || echo "Nothing on port 3128"
            
            # Test with retry logic
            for domain in "circleci.com" "app.circleci.com" "api.circleci.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              # If curl failed, set response to 000
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi
              
              echo "curl exit code: $curl_exit_code, response: $response"
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              fi
            done
            
            echo "✅ All CircleCI domain tests completed"
      
      - run:
          name: "Test GitHub domains (should be ALLOWED)"
          command: |
            echo "🔍 Testing GitHub domains (Expected: ALLOWED)"
            echo "============================================="
            
            for domain in "github.com" "api.github.com" "raw.githubusercontent.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              # If curl failed, set response to 000
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi
              
              echo "curl exit code: $curl_exit_code, response: $response"
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "✅ ALLOWED (HTTP $response)"
              else
                echo "❌ BLOCKED or ERROR (curl exit: $curl_exit_code, response: $response)"
                echo "Checking Squid logs..."
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              fi
            done
            
            echo "✅ All GitHub domain tests completed"
      
      - run:
          name: "Test Google domains (should be BLOCKED)"
          command: |
            echo "🔍 Testing Google domains (Expected: BLOCKED)"
            echo "============================================"
            
            echo "Checking Squid status..."
            pgrep squid || echo "Squid not running!"
            lsof -i :3128 2>/dev/null || ss -tlnp 2>/dev/null | grep :3128 || echo "Nothing listening on port 3128"
            
            for domain in "google.com" "www.google.com" "gmail.com"; do
              echo -n "Testing $domain: "
              
              # Try with proxy - capture exit code properly
              response=$(curl -s -o /dev/null -w "%{http_code}" --proxy http://127.0.0.1:3128 --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
              curl_exit_code=$?
              # If curl failed, set response to 000
              if [ $curl_exit_code -ne 0 ]; then
                response="000"
              fi
              
              echo "curl exit code: $curl_exit_code, response: $response"
              
              if [ $curl_exit_code -eq 0 ] && [ "$response" != "000" ]; then
                echo "❌ UNEXPECTEDLY ALLOWED (HTTP $response)"
                echo "Checking Squid logs..."
                sudo tail -n 10 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
                echo "Trying without proxy to verify domain is reachable..."
                direct_response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://$domain" 2>/dev/null)
                echo "Direct access response: $direct_response"
                exit 1
              else
                echo "✅ BLOCKED (curl exit: $curl_exit_code, response: $response)"
                # Show Squid logs to confirm the block
                echo "Checking Squid logs to confirm block:"
                sudo tail -n 5 /var/log/squid/access.log 2>/dev/null || echo "No access log found"
              fi
            done
            
            echo "✅ All Google domain tests completed"
      
      - run:
          name: "Test summary and cleanup"
          command: |
            echo ""
            echo "🎉 All tests completed successfully!"
            echo "=================================="
            echo "✅ CircleCI and GitHub domains are accessible"
            echo "✅ Google and other domains are blocked"
            echo ""
            echo "Squid proxy is working correctly!"
            
            echo ""
            echo "🎉 Squid proxy test completed successfully!"

jobs:
  test-squid-proxy:
    executor: machine
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-macos:
    executor: macos
    steps:
      - checkout
      - setup-squid
      - test-connectivity

  test-squid-proxy-docker:
    executor: docker
    steps:
      - checkout
      - setup-squid
      - test-connectivity

workflows:
  test-proxy-access-control:
    jobs:
      - test-squid-proxy
      - test-squid-proxy-macos
      - test-squid-proxy-docker