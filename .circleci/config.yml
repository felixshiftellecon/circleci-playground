version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: touch file.txt
      - save_cache:
          key: myapp-{{ .Branch }}-{{ checksum "file.txt" }}
          paths:
            - file.txt

  job_b:
    executor: base
    steps:
      - checkout
      - restore_cache:
          key: myapp-{{ .Branch }}-{{ checksum "file.txt" }}
      - run: echo "running job b"
      - run: cat path_b/README.md

workflows:
  workflow-a:
    jobs:
      - job_a
      - job_b