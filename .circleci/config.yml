version: 2.1

parameters:
  test:
    type: string
    default: "pass me"

orbs:
  inline-orb:
    jobs:
      orb-job:
        docker:
          - image: cimg/base:stable
        resource_class: small
        parameters:
          job_param_1:
            type: string
            default: "don't show me"
        steps:
          - run: echo << parameters.job_param_1 >>

workflows:
  test-workflow:
    jobs:
      - inline-orb/orb-job:
          job_param_1: << pipeline.parameters.test >>
