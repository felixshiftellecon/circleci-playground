version: 2.1

executors:
  base:
    docker:
      - image: cimg/base:stable
    resource_class: small

jobs:
  job_a:
    executor: base
    steps:
      - checkout
      - run: circleci-agent step halt
  semgrep:
    executor: base
    steps:
      - run: echo "running job b"

workflows:
  workflow-a:
    jobs:
      - job_a
      - semgrep:
          name: something_else
          requires:
            - job_a